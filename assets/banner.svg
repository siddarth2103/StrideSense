    <circle cx="141" cy="141" r="91" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-dasharray="480 95" transform="rotate(-32 141 141)"/>
    <path d="M78 152h39l18-52 30 93 21-57h34" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(470 126)">
