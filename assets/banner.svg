<svg width="1400" height="470" viewBox="0 0 1400 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">StrideSense</title>
  <desc id="desc">AI-powered fitness tracking for Android</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.52" stop-color="#10273b"/>
      <stop offset="1" stop-color="#160d2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#61f5a1"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1400" height="470" rx="34" fill="url(#background)"/>
  <circle cx="180" cy="120" r="290" fill="url(#cyanGlow)"/>
  <circle cx="1240" cy="390" r="330" fill="url(#pinkGlow)"/>
  <path d="M0 370 C210 305 330 430 555 354 S880 290 1050 360 S1260 430 1400 350" fill="none" stroke="url(#accent)" stroke-opacity=".18" stroke-width="2"/>
  <g transform="translate(110 94)" filter="url(#softShadow)">
